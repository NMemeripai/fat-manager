<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<title>FAT Manager</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root[data-theme="light"]{
  /* brand */
  --accent:#2563EB; --accent-2:#1E40AF; --accent-soft:#DBEAFE; --accent-softer:#EFF6FF;
  /* surfaces */
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --border:#E5E7EB; --border-strong:#D1D5DB;
  /* text */
  --text:#111827; --text-2:#6B7280; --text-3:#9CA3AF;
  /* status */
  --green:#22C55E; --green-soft:#DCFCE7; --green-2:#16A34A;
  --amber:#F59E0B; --amber-soft:#FEF3C7; --amber-2:#B45309;
  --red:#EF4444; --red-soft:#FEE2E2; --red-2:#DC2626;
  /* elevation */
  --shadow-xs:0 1px 2px rgba(17,24,39,.04);
  --shadow-sm:0 1px 3px rgba(30,41,89,.06), 0 1px 2px rgba(30,41,89,.04);
  --shadow-md:0 4px 12px rgba(30,41,89,.08), 0 2px 4px rgba(30,41,89,.04);
  --shadow-lg:0 12px 32px rgba(30,41,89,.14), 0 4px 10px rgba(30,41,89,.06);
  --shadow: var(--shadow-sm);
  --ring: 0 0 0 3.5px rgba(37,99,235,.14);
}
:root[data-theme="dark"]{
  --accent:#60A5FA; --accent-2:#3B82F6; --accent-soft:#1E3A6B; --accent-softer:#16233F;
  --bg:#0B1220; --surface:#111A2C; --surface-2:#17223A; --border:#22304C; --border-strong:#2E3F60;
  --text:#EEF2FA; --text-2:#9AA7C2; --text-3:#6B7A99;
  --green:#4ADE80; --green-soft:#123321; --green-2:#22C55E;
  --amber:#FBBF24; --amber-soft:#3A2A0C; --amber-2:#F59E0B;
  --red:#F87171; --red-soft:#3A1518; --red-2:#EF4444;
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --shadow: var(--shadow-sm);
  --ring: 0 0 0 3.5px rgba(96,165,250,.22);
}
:root{
  --r-lg:16px; --r-md:12px; --r-sm:8px; --r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .2s var(--ease), color .2s var(--ease);
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-0.015em; font-family:'Plus Jakarta Sans','Inter',sans-serif;}
p{margin:0;}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
*:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

@keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0; transform:scale(.97) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);}}
@keyframes shimmer{0%{background-position:-400px 0;} 100%{background-position:400px 0;}}
@keyframes slideInRight{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pulseDot{0%,100%{opacity:1;} 50%{opacity:.4;}}

.fade-in{animation:fadeIn .35s var(--ease);}

/* ---------- skeleton / loader ---------- */
.skel{
  background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
  background-size:400px 100%; animation:shimmer 1.4s infinite linear; border-radius:var(--r-sm);
}
.boot-screen{min-height:100vh; background:var(--bg); display:flex;}
.boot-sidebar{width:232px; background:var(--surface); border-right:1px solid var(--border); padding:20px;}
.boot-main{flex:1; padding:24px 28px;}
.boot-topbar{height:58px; background:var(--surface); border-bottom:1px solid var(--border); margin:-24px -28px 24px; display:flex; align-items:center; padding:0 20px;}
.spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;}
.spinner-accent{border:2px solid var(--accent-soft); border-top-color:var(--accent);}

/* ---------- icons ---------- */
.icon{width:18px; height:18px; flex-shrink:0; stroke:currentColor; stroke-width:1.8; fill:none; stroke-linecap:round; stroke-linejoin:round; vertical-align:-4px;}
.icon-sm{width:15px; height:15px;}
.icon-lg{width:22px; height:22px;}

/* ---------- layout ---------- */
#app{min-height:100vh;}
.shell{display:flex; min-height:100vh;}
.sidebar{
  width:232px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; transition:background .2s var(--ease);
}
.brand{padding:22px 18px 16px; display:flex; align-items:center; gap:10px;}
.brand-mark{width:32px; height:32px; border-radius:var(--r-sm); background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; font-family:'Plus Jakarta Sans',sans-serif; box-shadow:var(--shadow-sm);}
.brand-name{font-weight:750; font-size:15px; font-family:'Plus Jakarta Sans',sans-serif;}
.brand-sub{font-size:11px; color:var(--text-3); margin-top:-1px;}
.nav{flex:1; padding:10px 12px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--r-sm); color:var(--text-2);
  font-size:13.5px; font-weight:550; margin-bottom:2px; transition:background .15s var(--ease), color .15s var(--ease), transform .1s;
  position:relative;
}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item:active{transform:scale(.98);}
.nav-item.active{background:var(--accent-softer); color:var(--accent); font-weight:700;}
.nav-item.active .icon{stroke:var(--accent);}
.nav-icon{display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.nav-section-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-3); padding:16px 12px 7px; font-weight:700;}
.sidebar-foot{padding:12px; border-top:1px solid var(--border);}
.user-chip{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:var(--r-sm); transition:background .15s var(--ease);}
.user-chip:hover{background:var(--surface-2);}
.avatar{width:29px; height:29px; border-radius:50%; background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;}
.user-meta{overflow:hidden;}
.user-name{font-size:13px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.user-role{font-size:11px; color:var(--text-3);}

.main{flex:1; min-width:0;}
.topbar{
  height:58px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.72); backdrop-filter:blur(10px); display:flex; align-items:center;
  gap:12px; padding:0 20px; position:sticky; top:0; z-index:20;
}
:root[data-theme="dark"] .topbar{background:rgba(17,26,44,.72);}
.search-wrap{flex:1; max-width:420px; position:relative;}
.search-input{
  width:100%; padding:8px 12px 8px 34px; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
  color:var(--text); outline:none; transition:border-color .15s var(--ease), box-shadow .15s var(--ease), background .15s var(--ease);
}
.search-input:focus{border-color:var(--accent); background:var(--surface); box-shadow:var(--ring);}
.search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text-3); display:flex;}
.topbar-spacer{flex:1;}
.icon-btn{
  width:34px; height:34px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface);
  display:flex; align-items:center; justify-content:center; color:var(--text-2); position:relative; transition:background .15s var(--ease), border-color .15s var(--ease), transform .1s, color .15s;
}
.icon-btn:hover{background:var(--surface-2); color:var(--text); border-color:var(--border-strong);}
.icon-btn:active{transform:scale(.94);}
.badge-dot{position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:9.5px; font-weight:700; border-radius:9px; min-width:16px; height:16px; display:flex; align-items:center; justify-content:center; padding:0 3px; border:2px solid var(--surface);}
.content{padding:26px 30px 64px; max-width:1360px;}

/* ---------- generic components ---------- */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px; gap:12px; flex-wrap:wrap;}
.page-title{font-size:22px;}
.page-sub{color:var(--text-2); font-size:13px; margin-top:4px;}
.btn{
  border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8.5px 15px; border-radius:var(--r-sm);
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:all .15s var(--ease);
  box-shadow:var(--shadow-xs);
}
.btn:hover{background:var(--surface-2); border-color:var(--border-strong); transform:translateY(-1px); box-shadow:var(--shadow-sm);}
.btn:active{transform:translateY(0) scale(.98);}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 1px 2px rgba(37,99,235,.15), 0 2px 8px rgba(37,99,235,.18);}
.btn-primary:hover{background:var(--accent-2); border-color:var(--accent-2); box-shadow:0 2px 4px rgba(37,99,235,.2), 0 6px 16px rgba(37,99,235,.24);}
.btn-danger{color:var(--red); border-color:var(--red-soft);}
.btn-danger:hover{background:var(--red-soft); border-color:var(--red);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:var(--r-sm);}
.btn-ghost{border-color:transparent; background:transparent; box-shadow:none;}
.btn-ghost:hover{background:var(--surface-2); box-shadow:none; transform:none;}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

.grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px 20px; box-shadow:var(--shadow-sm); transition:box-shadow .2s var(--ease), transform .2s var(--ease); animation:fadeIn .35s var(--ease);}
.card:hover{box-shadow:var(--shadow-md); transform:translateY(-2px);}
.stat-label{font-size:12px; color:var(--text-2); font-weight:650; display:flex; align-items:center; gap:7px;}
.stat-icon{width:26px; height:26px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.stat-value{font-size:27px; font-weight:750; margin-top:10px; letter-spacing:-0.02em; font-family:'Plus Jakarta Sans',sans-serif;}
.stat-foot{font-size:11.5px; color:var(--text-3); margin-top:5px; display:flex; align-items:center; gap:5px;}

.section-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:20px 22px; margin-bottom:18px; box-shadow:var(--shadow-sm); animation:fadeIn .35s var(--ease);}
.section-card h3{font-size:14.5px; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; font-family:'Plus Jakarta Sans',sans-serif;}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface); box-shadow:var(--shadow-sm);}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; padding:12px 16px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-3);
  border-bottom:1px solid var(--border); background:var(--surface-2); white-space:nowrap; font-weight:700; user-select:none;
}
thead th.sortable{cursor:pointer; transition:color .15s var(--ease);}
thead th.sortable:hover{color:var(--accent);}
.sort-arrow{display:inline-block; margin-left:4px; opacity:.5; font-size:10px;}
.sort-arrow.active{opacity:1; color:var(--accent);}
tbody td{padding:12px 16px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr{transition:background .12s var(--ease);}
tbody tr.clickable:hover{background:var(--accent-softer); cursor:pointer;}
.cell-strong{font-weight:650;}
.cell-muted{color:var(--text-3);}
.table-foot{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap; gap:10px;}
.pager{display:flex; align-items:center; gap:4px;}
.pager-btn{width:28px; height:28px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-2); font-size:12px; transition:all .15s var(--ease);}
.pager-btn:hover:not(:disabled){background:var(--surface-2); color:var(--text);}
.pager-btn:disabled{opacity:.4; cursor:not-allowed;}
.pager-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3.5px 10px; border-radius:var(--r-pill); font-size:11.5px; font-weight:650; line-height:1.3;}
.badge-dot-ico{width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0;}
.badge-green{background:var(--green-soft); color:var(--green-2);}
.badge-amber{background:var(--amber-soft); color:var(--amber-2);}
.badge-red{background:var(--red-soft); color:var(--red-2);}
.badge-neutral{background:var(--surface-2); color:var(--text-2);}
.badge-accent{background:var(--accent-soft); color:var(--accent-2);}

.filters-row{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.select, .input, textarea.input{
  border:1px solid var(--border); background:var(--surface); color:var(--text); padding:8px 11px; border-radius:var(--r-sm); outline:none;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
.select:hover, .input:hover{border-color:var(--border-strong);}
.select:focus, .input:focus{border-color:var(--accent); box-shadow:var(--ring);}
.input.field-error{border-color:var(--red); box-shadow:0 0 0 3.5px rgba(239,68,68,.12);}
.field-error-msg{color:var(--red); font-size:11.5px; margin-top:5px; font-weight:600; display:flex; align-items:center; gap:5px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:650; color:var(--text-2); margin-bottom:6px;}
.field .input, .field select, .field textarea{width:100%;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
textarea{resize:vertical; min-height:72px;}
input[type="date"]{color-scheme:light;}
:root[data-theme="dark"] input[type="date"]{color-scheme:dark;}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(35%) sepia(80%) saturate(2000%) hue-rotate(211deg); cursor:pointer; border-radius:4px; padding:2px;}
.file-drop{border:1.5px dashed var(--border-strong); border-radius:var(--r-md); padding:20px; text-align:center; color:var(--text-2); font-size:12.5px; cursor:pointer; transition:all .15s var(--ease); background:var(--surface-2);}
.file-drop:hover{border-color:var(--accent); background:var(--accent-softer); color:var(--accent-2);}
.file-drop .icon{margin:0 auto 6px; display:block;}
.file-chip{display:inline-flex; align-items:center; gap:6px; background:var(--accent-softer); color:var(--accent-2); padding:5px 10px; border-radius:var(--r-pill); font-size:12px; font-weight:600; margin-top:8px;}

.empty-state{padding:48px 20px; text-align:center; color:var(--text-3);}
.empty-state .em-icon{width:52px; height:52px; border-radius:50%; background:var(--surface-2); color:var(--text-3); display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.empty-state .em-title{color:var(--text-2); font-weight:650; font-size:13.5px; margin-bottom:4px;}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:6vh 16px; z-index:100; overflow-y:auto; animation:fadeIn .18s var(--ease);}
.modal{background:var(--surface); border-radius:var(--r-lg); width:100%; max-width:560px; box-shadow:var(--shadow-lg); border:1px solid var(--border); animation:scaleIn .22s var(--ease);}
.modal.modal-wide{max-width:800px;}
.modal.modal-sm{max-width:400px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-body{padding:22px; max-height:70vh; overflow-y:auto;}
.modal-foot{padding:15px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:9px;}

/* tabs */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
.tab{padding:9px 14px; font-size:13px; font-weight:650; color:var(--text-2); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s var(--ease), border-color .15s var(--ease); display:flex; align-items:center; gap:6px;}
.tab.active{color:var(--accent); border-color:var(--accent);}
.tab:hover{color:var(--text);}

/* timeline */
.timeline{display:flex; gap:0; align-items:stretch; margin:12px 0 4px;}
.tl-step{flex:1; display:flex; flex-direction:column; align-items:center; position:relative; padding-top:4px;}
.tl-line{position:absolute; top:16px; left:-50%; width:100%; height:2px; background:var(--border); z-index:0; transition:background .2s var(--ease);}
.tl-step:first-child .tl-line{display:none;}
.tl-dot{width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; z-index:1; border:2px solid var(--border); background:var(--surface); color:var(--text-3); transition:all .2s var(--ease);}
.tl-step.done .tl-dot{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 0 0 4px var(--green-soft);}
.tl-step.current .tl-dot{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 0 4px var(--accent-soft);}
.tl-step.done .tl-line{background:var(--green);}
.tl-label{font-size:11.5px; font-weight:650; margin-top:8px; text-align:center;}
.tl-sub{font-size:10.5px; color:var(--text-3); text-align:center;}

/* bars & progress */
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
.bar-label{width:150px; font-size:12.5px; color:var(--text-2); flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{flex:1; height:8px; border-radius:var(--r-pill); background:var(--surface-2); overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius:var(--r-pill); transition:width .5s var(--ease);}
.bar-val{width:34px; text-align:right; font-size:12px; color:var(--text-3); font-weight:600;}
.ring-wrap{position:relative; width:88px; height:88px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-track{fill:none; stroke:var(--surface-2); stroke-width:8;}
.ring-fill{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .6s var(--ease);}
.ring-label{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:750; font-size:17px; font-family:'Plus Jakarta Sans',sans-serif;}

.kv{display:grid; grid-template-columns:130px 1fr; gap:7px 10px; font-size:13px;}
.kv dt{color:var(--text-3);}
.kv dd{margin:0; font-weight:600;}

.notif-item{display:flex; gap:11px; padding:12px 15px; border-bottom:1px solid var(--border); transition:background .12s var(--ease);}
.notif-item:hover{background:var(--surface-2);}
.notif-item:last-child{border-bottom:none;}
.notif-ico{width:30px; height:30px; border-radius:var(--r-sm); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.notif-text{font-size:12.5px;}
.notif-title{font-weight:650; margin-bottom:1px;}
.notif-sub{color:var(--text-3); font-size:11.5px;}

.activity-item{display:flex; gap:11px; padding:10px 0; border-bottom:1px solid var(--border);}
.activity-item:last-child{border-bottom:none; padding-bottom:0;}

function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatFileSize(bytes){
  if(bytes==null) return '';
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/(1024*1024)).toFixed(1)+' MB';
}
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function fmtRelative(iso){
  const diff = Math.round((Date.now() - new Date(iso).getTime())/1000);
  if(diff<60) return 'hace instantes';
  if(diff<3600) return 'hace '+Math.floor(diff/60)+' min';
  if(diff<86400) return 'hace '+Math.floor(diff/3600)+' h';
  return 'hace '+Math.floor(diff/86400)+' d';
}

/* ---------------------------- seed data ---------------------------- */
/* ---------------------------- API layer (backend real: Express + SQLite) ---------------------------- */
const API_BASE = ''; // mismo origen: Express sirve esta página y la API
let authToken = null;

function handleSessionExpired(){
  const yaEstabaLogueado = !!authToken;
  authToken=null; session=null; localStorage.removeItem('fat_token'); localStorage.removeItem('fat_session');
  const msg = yaEstabaLogueado
    ? 'Tu sesión expiró (por seguridad, dura unas horas). Iniciá sesión de nuevo — lo que ya se había guardado antes sigue intacto.'
    : 'Tu sesión expiró. Iniciá sesión de nuevo para continuar.';
  const appEl = document.getElementById('app');
  if(appEl){ appEl.innerHTML = renderLogin(msg); attachLoginEvents(); }
  return msg;
}
async function apiFetch(method, url, body){
  const headers = {'Content-Type':'application/json'};
  if(authToken) headers.Authorization = 'Bearer '+authToken;
  let res;
  try{
    res = await fetch(API_BASE+url, { method, headers, body: body!==undefined? JSON.stringify(body): undefined });
  }catch(e){
    throw new Error('No se pudo conectar con el servidor. ¿Está corriendo el backend?');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){ /* respuesta sin cuerpo */ }
  if(!res.ok){
    if(res.status===401) throw new Error(handleSessionExpired());
    throw new Error((data && data.error) ? data.error : ('Error del servidor ('+res.status+')'));
  }
  return data;
}

async function downloadAuthFile(url, fallbackName){
  try{
    const res = await fetch(API_BASE+url, { headers: { Authorization: 'Bearer '+authToken } });
    if(res.status===401) throw new Error(handleSessionExpired());
    if(!res.ok){
      let msg = 'No se pudo descargar el archivo';
      try{ msg = (await res.json()).error || msg; }catch(e){}
      throw new Error(msg);
    }
    const blob = await res.blob();
    let filename = fallbackName || 'archivo';
    const cd = res.headers.get('Content-Disposition');
    if(cd){ const m = cd.match(/filename="([^"]+)"/); if(m) filename = m[1]; }
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(blobUrl), 4000);
  }catch(e){
    toast(e.message||'No se pudo descargar el archivo', 'red');
  }
}

/* ---------------------------- derived helpers ---------------------------- */
function currentWeekOf(student){
  const d = daysBetween(student.fechaInicio, todayISO());
  const wk = Math.floor(d/7)+1;
  return Math.max(1, Math.min(wk, DB.config.totalWeeks));
}
function rotationsOf(studentId){ return DB.rotations.filter(r=>r.studentId===studentId).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')); }
function currentRotationOf(studentId){
  const rots = rotationsOf(studentId);
  const t = todayISO();
  let cur = rots.find(r=> t>=r.startDate && t<=r.endDate);
  if(!cur) cur = rots.filter(r=>r.status!=='finalizada')[0] || rots[rots.length-1];
  return cur;
}
// Única fuente de verdad para "¿está esta rotación en curso HOY?": se calcula siempre
// a partir de las fechas de inicio/fin, nunca del campo status guardado manualmente
// (que solo se usa para marcar el cierre/finalización definitiva de una rotación).
function isRotationCurrentByDate(r){
  const t = todayISO();
  return r.status!=='finalizada' && t>=r.startDate && t<=r.endDate;
}
function studentsCurrentlyInSection(sectionId){
  return DB.students.filter(s=> s.estado==='activo' && rotationsOf(s.id).some(r=> r.sectionId===sectionId && isRotationCurrentByDate(r)));
}
function sectionName(id){ const s=DB.sections.find(x=>x.id===id); return s?s.nombre:'—'; }
function groupName(id){ const g=(DB.groups||[]).find(x=>x.id===id); return g?g.nombre:'—'; }
function teacherName(id){ const t=DB.teachers.find(x=>x.id===id); return t?t.nombre:'—'; }
function studentName(id){ const s=DB.students.find(x=>x.id===id); return s? s.nombre+' '+s.apellido : '—'; }
function rotationAvg(rotation){
  const notas = (rotation.informesSemanales||[]).map(e=>e.nota).filter(n=>n!=null && n!=='');
  if(!notas.length) return null;
  return (notas.reduce((a,b)=>a+Number(b),0)/notas.length);
}
function studentAvg(studentId){
  const avgs = rotationsOf(studentId).map(r=>rotationAvg(r)).filter(a=>a!=null);
  if(!avgs.length) return null;
  return (avgs.reduce((a,b)=>a+b,0)/avgs.length).toFixed(1);
}
function isRotationEditableBy(rotation){
  if(!session) return false;
  if(session.role==='admin') return true;
  if(session.role==='seccion') return rotation.teacherId===session.teacherId;
  return false;
}
function computeNotifications(){
  const list = [];
  const t = todayISO();
  DB.rotations.forEach(r=>{
    const st = DB.students.find(s=>s.id===r.studentId);
    if(!st || st.estado!=='activo') return;
    if(isRotationCurrentByDate(r)){
      const wk = currentWeekOf(st);
      const hasReportThisWeek = r.informesSemanales.some(is=>is.semana===wk);
      if(!hasReportThisWeek){
        list.push({type:'informe', icon:'file', color:'amber', title:'Falta informe semanal', sub:studentName(r.studentId)+' · '+sectionName(r.sectionId)+' · semana '+wk});
      }
      if(t>=r.endDate && daysBetween(t,r.endDate) <= 0 && !r.informeFinal){
        list.push({type:'informe-final', icon:'file', color:'red', title:'Falta informe final', sub:studentName(r.studentId)+' · '+sectionName(r.sectionId)});
      }
    }
    if(r.status==='finalizada' && rotationAvg(r)==null){
      list.push({type:'nota', icon:'award', color:'red', title:'Falta cargar calificaciones semanales', sub:studentName(r.studentId)+' · '+sectionName(r.sectionId)});
    }
    if(r.status==='pendiente'){
      const d = daysBetween(t, r.startDate);
      if(d>=0 && d<=7){
        list.push({type:'proxima', icon:'arrowRight', color:'accent', title:'Rotación próxima a iniciar', sub:studentName(r.studentId)+' · '+sectionName(r.sectionId)+' · '+fmtDate(r.startDate)});
      }
    }
  });
  const pendCount = (DB.pendientes||[]).filter(p=>p.estado!=='completado').length;
  if(pendCount){
    list.push({type:'pendientes', icon:'alertTriangle', color:'amber', title:'Contenidos pendientes sin resolver', sub:pendCount+' registro'+(pendCount===1?'':'s')+' en Contenidos Pendientes'});
  }
  if(session && session.role==='seccion'){
    (DB.comunicados||[]).filter(c=>!c.miLectura).forEach(c=>{
      const color = c.prioridad==='urgente'?'red':(c.prioridad==='importante'?'amber':'accent');
      list.push({type:'comunicado', icon:'bell', color, title:'Nuevo lineamiento: '+c.titulo, sub:prioridadLabelPlain(c.prioridad)+(c.vencimiento? ' · Vence '+fmtDate(c.vencimiento) : '')});
    });
  }
  return list;
}
function prioridadLabelPlain(prioridad){ return {urgente:'Urgente', importante:'Importante', informativo:'Informativo'}[prioridad] || prioridad; }

/* ---------------------------- toast ---------------------------- */
function toast(msg,color){
  color = color || 'green';
  let stack = document.getElementById('toast-stack');
  if(!stack){ stack = document.createElement('div'); stack.id='toast-stack'; stack.className='toast-stack'; document.body.appendChild(stack); }
  const iconName = color==='red' ? 'xCircle' : color==='amber' ? 'alertTriangle' : 'checkCircle';
  const iconColorVar = color==='red' ? 'red-2' : color==='amber' ? 'amber-2' : 'green-2';
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<span class="toast-ico" style="background:var(--'+color+'-soft); color:var(--'+iconColorVar+')">'+icon(iconName,'icon-sm')+'</span><span>'+esc(msg)+'</span>';
  stack.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(), 220); }, 2800);
}

/* ---------------------------- DASHBOARD ---------------------------- */
function renderRing(percent){
  const r=38, c=2*Math.PI*r;
  const pct = Math.max(0, Math.min(100, percent));
  const offset = c - (pct/100)*c;
  return `<div class="ring-wrap">
    <svg viewBox="0 0 88 88" width="88" height="88">
      <circle class="ring-track" cx="44" cy="44" r="${r}"/>
      <circle class="ring-fill" cx="44" cy="44" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="ring-label">${pct}%</div>
  </div>`;
}

function statCard(label, value, foot, iconName, tone){
  const toneMap = { accent:['accent-soft','accent-2'], amber:['amber-soft','amber-2'], red:['red-soft','red-2'], green:['green-soft','green-2'], neutral:['surface-2','text-2'] };
  const [bg,fg] = toneMap[tone] || toneMap.accent;
  return `<div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-icon" style="background:var(--${bg}); color:var(--${fg});">${icon(iconName,'icon-sm')}</div>
    </div>
    <div class="stat-value">${value}</div>
    <div class="stat-foot">${foot}</div>
  </div>`;
}

/* ---------------------------- STUDENTS LIST ---------------------------- */
function studentSortValue(s, key){
  switch(key){
    case 'nombre': return (s.apellido+' '+s.nombre).toLowerCase();
    case 'curso': return (s.curso+s.division).toLowerCase();
    case 'legajo': {
      const digits = String(s.legajo||'').match(/\d+/g);
      return digits && digits.length ? digits.map(d=>d.padStart(10,'0')).join('-') : String(s.legajo||'').toLowerCase();
    }
    case 'semana': return s.estado==='activo' ? currentWeekOf(s) : -1;
    case 'promedio': return Number(studentAvg(s.id))||-1;
    case 'estado': return s.estado;
    default: return '';
  }
}
function thSort(table, key, label){
  const st = ui.sort[table];
  const active = st && st.key===key;
  const arrow = active ? (st.dir==='asc'?'↑':'↓') : '↕';
  return `<th class="sortable" data-action="sort-th" data-table="${table}" data-key="${key}">${label}<span class="sort-arrow ${active?'active':''}">${arrow}</span></th>`;
}
function sortAndPaginate(list, table, valueFn){
  const st = ui.sort[table];
  if(st){
    list = list.slice().sort((a,b)=>{
      const av=valueFn(a,st.key), bv=valueFn(b,st.key);
      if(av<bv) return st.dir==='asc'?-1:1;
      if(av>bv) return st.dir==='asc'?1:-1;
      return 0;
    });
  }
  const totalPages = Math.max(1, Math.ceil(list.length/PAGE_SIZE));
  const page = Math.min(ui.page[table]||1, totalPages);
  const start = (page-1)*PAGE_SIZE;
  return { pageItems:list.slice(start,start+PAGE_SIZE), totalPages, page, total:list.length };
}
function renderPager(table, page, totalPages, total){
  if(totalPages<=1) return `<div class="table-foot"><span class="cell-muted" style="font-size:12px;">${total} resultado${total===1?'':'s'}</span><div></div></div>`;
  let pages='';
  for(let p=1;p<=totalPages;p++){
    if(totalPages>7 && p!==1 && p!==totalPages && Math.abs(p-page)>1){ if(p===2||p===totalPages-1) pages+=`<span class="cell-muted" style="padding:0 4px;">…</span>`; continue; }
    pages += `<button class="pager-btn ${p===page?'active':''}" data-action="page" data-table="${table}" data-page="${p}">${p}</button>`;
  }
  return `<div class="table-foot">
    <span class="cell-muted" style="font-size:12px;">${total} resultados</span>
    <div class="pager">
      <button class="pager-btn" data-action="page" data-table="${table}" data-dir="prev" ${page<=1?'disabled':''}>${icon('chevronLeft','icon-sm')}</button>
      ${pages}
      <button class="pager-btn" data-action="page" data-table="${table}" data-dir="next" ${page>=totalPages?'disabled':''}>${icon('chevronRight','icon-sm')}</button>
    </div>
  </div>`;
}

function estadoBadge(estado){
  const map = {activo:'green', pausado:'amber', finalizado:'accent', abandonado:'red'};

}
function statusBadge(status){
  const map = {pendiente:['neutral','Pendiente'], en_curso:['amber','En curso'], finalizada:['green','Finalizada']};
  const [c,l] = map[status]||['neutral',status];
  return `<span class="badge badge-${c}"><span class="badge-dot-ico"></span>${l}</span>`;
}

      <button class="btn btn-sm" data-action="export-student-pdf" data-id="${s.id}">${icon('download','icon-sm')} PDF</button>

      <button class="btn btn-sm btn-danger" data-action="delete-student" data-id="${s.id}">${icon('trash','icon-sm')} Eliminar</button>`:''}
    </div>
  </div>

  <div class="grid-cards" style="grid-template-columns:repeat(4,1fr);">
    <div class="card"><div class="stat-label">Semana actual</div><div class="stat-value">${wk? wk+' / '+DB.config.totalWeeks : '—'}</div></div>
    <div class="card"><div class="stat-label">Estado</div><div class="stat-value" style="font-size:16px;">${estadoBadge(s.estado)}</div></div>

  <div class="section-card">

    ${(()=>{
      const noteCount = rots.reduce((a,r)=>a+(r.informesSemanales||[]).filter(e=>e.nota!=null).length, 0);
      const threshold = DB.config.notaAprobacion || 6;
      const aprobado = avg!=null && Number(avg) >= threshold;
      return `<div style="display:flex; gap:28px; align-items:center; flex-wrap:wrap;">
        <div><div class="cell-muted" style="font-size:12px;">Promedio numérico</div><div class="stat-value" style="margin-top:4px;">${avg||'—'}</div></div>

      </div>

  <div class="section-card">
    <h3>Recorrido por secciones</h3>

      ${rots.map((r,i)=>{
        const cls = r.status==='finalizada'?'done':(isRotationCurrentByDate(r)?'current':'');
        const dot = r.status==='finalizada'? icon('check','icon-sm') : (i+1);
        return `<div class="tl-step ${cls}"><div class="tl-line"></div><div class="tl-dot">${dot}</div><div class="tl-label">${sectionDot(r.sectionId)} ${esc(sectionName(r.sectionId))}</div><div class="tl-sub">${fmtDate(r.startDate)} – ${fmtDate(r.endDate)}</div></div>`;
      }).join('')}
    </div>
  </div>

  <div class="section-card">
    <h3>Historial de rotaciones</h3>
    ${rots.map((r,i)=>renderRotationBlock(r,i+1)).join('')}
  </div>
  `;
}

/* ---------------------------- ROTATIONS ---------------------------- */
function rotationSortValue(r, key){
  switch(key){
    case 'alumno': return studentName(r.studentId).toLowerCase();
    case 'seccion': return sectionName(r.sectionId).toLowerCase();
    case 'profesor': return teacherName(r.teacherId).toLowerCase();
    case 'periodo': return r.startDate;
    case 'estado': return r.status;
    case 'nota': return rotationAvg(r)==null? -1 : rotationAvg(r);
    default: return '';
  }
}
function renderRotations(){
  let list = DB.rotations.slice();
  const f = ui.filters;
  if(f.rotSeccion) list = list.filter(r=>r.sectionId===f.rotSeccion);
  if(f.rotEstado) list = list.filter(r=>r.status===f.rotEstado);
  if(session.role==='seccion') list = list.filter(r=>r.teacherId===session.teacherId);

  const { pageItems, totalPages, page, total } = sortAndPaginate(list, 'rotations', rotationSortValue);

  return `
  <div class="page-head">
    <div><h1 class="page-title">Rotaciones</h1><p class="page-sub">${list.length} rotaciones</p></div>
  </div>
  <div class="filters-row">
    <select class="select" data-action="filter-rot-seccion"><option value="">Todas las secciones</option>${DB.sections.map(s=>`<option value="${s.id}" ${f.rotSeccion===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select>
    <select class="select" data-action="filter-rot-estado"><option value="">Todos los estados</option>
      <option value="pendiente" ${f.rotEstado==='pendiente'?'selected':''}>Pendiente</option>
      <option value="en_curso" ${f.rotEstado==='en_curso'?'selected':''}>En curso</option>
      <option value="finalizada" ${f.rotEstado==='finalizada'?'selected':''}>Finalizada</option>
    </select>
  </div>
  <div class="table-wrap">
  <table>
    <thead><tr>
      ${thSort('rotations','alumno','Alumno')}
      ${thSort('rotations','seccion','Sección')}
      ${thSort('rotations','profesor','Profesor')}
      ${thSort('rotations','periodo','Período')}
      ${thSort('rotations','estado','Estado')}
      ${thSort('rotations','nota','Nota')}
      <th></th>
    </tr></thead>
    <tbody>
    ${pageItems.length? pageItems.map(r=>`
      <tr>
        <td class="cell-strong" style="cursor:pointer;" data-action="open-student" data-id="${r.studentId}">${esc(studentName(r.studentId))}</td>
        <td>${sectionDot(r.sectionId)} ${esc(sectionName(r.sectionId))}</td>
        <td class="cell-muted">${esc(teacherName(r.teacherId))}</td>
        <td class="cell-muted">${fmtDate(r.startDate)} – ${fmtDate(r.endDate)}</td>
        <td>${statusBadge(r.status)}</td>

        <td style="white-space:nowrap; display:flex; gap:6px;">
          ${isRotationEditableBy(r)? `<button class="btn btn-sm" data-action="edit-rotation" data-id="${r.id}">${icon('edit','icon-sm')} Cargar</button>`:''}
          ${session.role==='admin'? `<button class="btn btn-sm btn-danger" data-action="delete-rotation" data-id="${r.id}">${icon('trash','icon-sm')}</button>`:''}
        </td>
      </tr>`).join('') : `<tr><td colspan="7"><div class="empty-state"><div class="em-icon">${icon('refresh')}</div><div class="em-title">Sin rotaciones</div>Ajustá los filtros seleccionados.</div></td></tr>`}

  </table>
  ${renderPager('rotations', page, totalPages, total)}

}

/* ---------------------------- CONTENIDOS PENDIENTES ---------------------------- */
function pendienteEstadoBadge(estado){
  const map = {pendiente:['red','Pendiente'], en_recuperacion:['amber','En proceso'], completado:['green','Recuperado']};
  const [c,l] = map[estado]||['neutral',estado];
  return `<span class="badge badge-${c}"><span class="badge-dot-ico"></span>${l}</span>`;
}
function renderPendientes(){
  let list = (DB.pendientes||[]).slice();
  if(session.role==='seccion') list = list.filter(p=>p.teacherId===session.teacherId);
  list.sort((a,b)=> (a.estado==='completado')-(b.estado==='completado') || (b.createdAt||'').localeCompare(a.createdAt||''));
  const canCreate = session.role==='admin' || session.role==='seccion';

  return `
  <div class="page-head">

    <tbody>
    ${list.length? list.map(p=>{
      const editable = session.role==='admin' || (session.role==='seccion' && p.teacherId===session.teacherId);
      return `<tr>
        <td class="cell-strong" style="cursor:pointer;" data-action="open-student" data-id="${p.studentId}">${esc(studentName(p.studentId))}</td>
        <td>${sectionDot(p.sectionId)} ${esc(sectionName(p.sectionId))}</td>
        <td class="cell-muted">${esc(teacherName(p.teacherId))}</td>
        <td>${p.semana||'—'}</td>
        <td class="cell-muted">${p.fecha? fmtDate(p.fecha) : '—'}</td>

          <select class="select" style="padding:5px 8px; font-size:12px;" data-action="pendiente-estado" data-id="${p.id}">

    </tbody>
  </table>
  </div>`;
}

/* ---------------------------- CRONOGRAMA DE ROTACIONES (grilla interactiva tipo Excel) ---------------------------- */
const SECTION_PALETTE = ['#2563EB','#16A34A','#D97706','#DB2777','#7C3AED','#0891B2','#DC2626','#4D7C0F','#0D9488','#9333EA'];
function sectionColor(sectionId){
  const sec = DB.sections.find(s=>s.id===sectionId);
  if(sec && sec.color) return sec.color;
  const sorted = DB.sections.slice().sort((a,b)=>a.orden-b.orden);
  const idx = sorted.findIndex(s=>s.id===sectionId);
  return SECTION_PALETTE[idx>=0? idx % SECTION_PALETTE.length : 0];
}
function sectionDot(sectionId){ return `<span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:${sectionColor(sectionId)}; flex-shrink:0;"></span>`; }
function mondayOf(iso){ const d=new Date(iso+'T00:00:00'); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.toISOString().slice(0,10); }

// Junta TODOS los registros de asistencia cargados en Planillas Digitales FAT para un alumno
// que caen dentro de un rango de fechas (una semana del cronograma) — es la integración
// automática entre "Planilla Digital FAT" y "Cronograma de Rotaciones".
function attendanceSummaryFor(studentId, weekStart, weekEnd){
  const planillasDelAlumno = (PLANILLAS||[]).filter(p=>p.studentId===studentId);
  const dias = [];
  planillasDelAlumno.forEach(p=>{
    (p.asistencia||[]).forEach(a=>{
      if(a.fecha>=weekStart && a.fecha<=weekEnd) dias.push(a);
    });
  });
  dias.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const presentes = dias.filter(d=>d.estado==='presente').length;
  const ausentes = dias.filter(d=>d.estado==='ausente').length;
  return { dias, presentes, ausentes, total:dias.length };
}

function renderCronogramaSemanalBody(){

      <select class="select" data-action="cron-filtro-seccion"><option value="">Todas las secciones</option>${DB.sections.map(s=>`<option value="${s.id}" ${ui.cronFiltroSeccion===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select>
      <select class="select" data-action="cron-filtro-curso"><option value="">Todos los cursos</option>${cursosVacio.map(c=>`<option value="${esc(c)}" ${ui.cronFiltroCurso===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    <div class="empty-state"><div class="em-icon">${icon('calendar')}</div><div class="em-title">No hay alumnos para mostrar con estos filtros</div>${hayFiltrosActivos? 'Probá elegir otro filtro arriba, o hacé clic en "Limpiar filtros".' : 'Todavía no hay alumnos activos o pausados cargados en el sistema.'}</div>`;
  }

  // Las semanas del cronograma arrancan en la duración total configurada del programa
  // (por defecto, hoy 20), pero SE EXTIENDEN AUTOMÁTICAMENTE si algún alumno visible
  // tiene una rotación (por ejemplo, una creada a mano en el Cronograma) cuya fecha cae
  // más allá de esa ventana relativa a SU PROPIA fecha de inicio. Sin esto, una rotación
  // guardada correctamente en la base de datos podía quedar sin ninguna columna donde
  // mostrarse — el bug real detrás de "la rotación no aparece".
  let numWeeks = DB.config.totalWeeks || 20;
  students.forEach(s=>{
    rotationsOf(s.id).forEach(r=>{
      const weekOfStart = Math.floor(daysBetween(s.fechaInicio, r.startDate)/7)+1;
      const weekOfEnd = Math.floor(daysBetween(s.fechaInicio, r.endDate)/7)+1;
      numWeeks = Math.max(numWeeks, weekOfStart, weekOfEnd);

  const weekNumbers = Array.from({length: numWeeks}, (_,i)=>i+1);

  const cursos = [...new Set(DB.students.map(s=>s.curso))];

  <div class="filters-row">
    <select class="select" data-action="cron-filtro-grupo"><option value="">Todos los grupos</option>${(DB.groups||[]).map(g=>`<option value="${g.id}" ${ui.cronFiltroGrupo===g.id?'selected':''}>${esc(g.nombre)}</option>`).join('')}</select>
    <select class="select" data-action="cron-filtro-seccion"><option value="">Todas las secciones</option>${DB.sections.map(s=>`<option value="${s.id}" ${ui.cronFiltroSeccion===s.id?'selected':''}>${esc(s.nombre)}</option>`).join('')}</select>
    <select class="select" data-action="cron-filtro-curso"><option value="">Todos los cursos</option>${cursos.map(c=>`<option value="${esc(c)}" ${ui.cronFiltroCurso===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
  </div>
  <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
    ${DB.sections.slice().sort((a,b)=>a.orden-b.orden).map(s=>`

        <span class="cron-legend-swatch" style="background:${sectionColor(s.id)};"></span>${esc(s.nombre)}

              return isAdmin
                ? `<td class="cron-cell cron-cell-empty cron-cell-addable" data-action="cron-add" data-student-id="${s.id}" data-week-start="${weekStart}" data-week-end="${weekEnd}" title="Semana ${n} (${fmtDate(weekStart)}) · Sin rotación asignada — clic para crear una">+</td>`

              else if(asis.presentes===0){ indicator = `<span class="cron-attend-dot cron-attend-bad" title="No asistió ningún día registrado esta semana">${icon('x','icon-sm')}</span>`; }
              else{ indicator = `<span class="cron-attend-dot cron-attend-warn" title="${asis.ausentes} inasistencia(s) esta semana"></span>`; }

/* ---------------------------- CRONOGRAMA DE ACTIVIDADES (calendario mensual, módulo nuevo e independiente) ---------------------------- */
function actividadesDelDia(fecha){
  return (DB.cronogramaActividades||[]).filter(a=>a.fecha===fecha).sort((a,b)=>(a.horaInicio||'99:99').localeCompare(b.horaInicio||'99:99'));
}
// Calculado 100% a partir de rotations (fechas de inicio/fin) — no se guarda nada nuevo,
// así que nunca puede quedar desactualizado ni duplicar información. Excluye a los alumnos
// que tengan una EXCEPCIÓN puntual cargada ese día (para que no figuren en dos lados a la vez).
function alumnosEnSeccionEseDia(sectionId, fecha){
  const conExcepcion = new Set((DB.cronogramaActividades||[]).filter(a=>a.fecha===fecha && a.studentId).map(a=>a.studentId));
  return DB.students.filter(s=> !conExcepcion.has(s.id) && rotationsOf(s.id).some(r=> r.sectionId===sectionId && fecha>=r.startDate && fecha<=r.endDate));
}
function actMesLabel(mes){
  const [y,m] = mes.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('es-AR', { month:'long', year:'numeric' });
}
function actAddMonths(mes, n){
  const [y,m] = mes.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function renderCronogramaActividadesBody(){
  const isAdmin = session.role==='admin' || session.role==='coordinador';
  const [y,m] = ui.actCalMes.split('-').map(Number);
  const firstOfMonth = ui.actCalMes+'-01';

  const gridStart = mondayOf(firstOfMonth);
  const gridEndBase = mondayOf(lastOfMonth);
  const gridEnd = addDays(gridEndBase, 6);
  const today = todayISO();

  const days = [];
  let cursor = gridStart;
  while(cursor<=gridEnd){ days.push(cursor); cursor = addDays(cursor,1); }
  const dayNames = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];

  return `

    </div>
  </div>
  <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;">
    ${DB.sections.slice().sort((a,b)=>a.orden-b.orden).map(s=>`
      <div class="cron-legend-item"><span class="cron-legend-swatch" style="background:${sectionColor(s.id)};"></span>${esc(s.nombre)}</div>`).join('')}
  </div>
  <div class="act-cal-grid" style="margin-bottom:6px;">
    ${dayNames.map(d=>`<div class="act-cal-head">${d}</div>`).join('')}
  </div>
  <div class="act-cal-grid">
    ${days.map(fecha=>{
      const isOutside = fecha<firstOfMonth || fecha>lastOfMonth;
      const isToday = fecha===today;
      const acts = actividadesDelDia(fecha);
      const shown = acts.slice(0,3);
      const extra = acts.length-shown.length;
      const dayNum = Number(fecha.slice(8,10));
      const tooltip = acts.length
        ? 'Actividades del '+fmtDate(fecha)+':\n'+acts.map(a=>{

          }).join('\n')
        : 'Sin actividades el '+fmtDate(fecha);
      return `<div class="act-cal-day ${isOutside?'act-cal-outside':''} ${isToday?'act-cal-today':''}" data-action="act-day-click" data-fecha="${fecha}" title="${esc(tooltip)}">
        <div class="act-cal-daynum">${dayNum}</div>
        ${shown.map(a=>`<div class="act-cal-bar" style="background:${sectionColor(a.sectionId)}; ${a.studentId?'border:1.5px dashed #fff;':''}">${a.studentId?icon('user','icon-sm')+' ':''}${esc(sectionName(a.sectionId))}</div>`).join('')}

}

function formatoLabel(formato){ return {pdf:'PDF', word:'Word', excel:'Excel'}[formato] || 'Otro'; }
function docEstadoBadge(estado){
  const map = { entregado:['green','Entregado'], en_progreso:['amber','En progreso'] };
  const [c,l] = map[estado] || ['neutral', estado||'—'];
  return `<span class="badge badge-${c}"><span class="badge-dot-ico"></span>${l}</span>`;
}
function docAlumnoSortValue(d, key){
  switch(key){
    case 'alumno': return (d.studentId? studentName(d.studentId):'').toLowerCase();
    case 'curso': return (d.curso||'').toLowerCase();
    case 'grupo': return (d.groupId? groupName(d.groupId):'').toLowerCase();
    case 'seccion': return (d.sectionId? sectionName(d.sectionId):'').toLowerCase();
    case 'semana': return d.semana==null? -1 : Number(d.semana);
    case 'fecha': return d.createdAt||d.fecha||'';
    case 'archivo': return (d.nombre||'').toLowerCase();
    case 'tamano': return d.tamano||0;
    case 'estado': return d.estado||'';
    default: return '';
  }
}
function renderDocumentos(){

    `;

}

function renderModal(){
  const m = ui.modal;
  if(!m) return '';
  let body='', title='', wide=false;
  if(m.type==='student-form'){ title = m.data? 'Editar alumno':'Nuevo alumno'; body = studentFormHtml(m.data); }
  else if(m.type==='section-form'){ title = m.data? 'Editar sección':'Nueva sección'; body = sectionFormHtml(m.data); }
  else if(m.type==='group-form'){ title = m.data? 'Editar grupo':'Nuevo grupo'; body = `<div class="field"><label>Nombre del grupo</label><input class="input" id="f-grupo-nombre" value="${m.data?esc(m.data.nombre):''}" placeholder="ej. Grupo A"></div>`; }
  else if(m.type==='teacher-form'){ title = m.data? 'Editar profesor':'Nuevo profesor'; body = teacherFormHtml(m.data); }
  else if(m.type==='rotation-form'){ title='Cargar rotación'; wide=true; body = rotationFormHtml(m.data); }
  else if(m.type==='guidelines-form'){ title='Editar lineamientos'; body = guidelinesFormHtml(); }
  else if(m.type==='consigna-form'){ title='Nueva consigna'; body = `<div class="field"><label>Texto</label><textarea class="input" id="f-consigna"></textarea></div>`; }
  else if(m.type==='objetivo-form'){ title='Nuevo objetivo semanal'; body = `<div class="field-row"><div class="field"><label>Semana</label><input class="input" type="number" min="1" max="${DB.config.totalWeeks}" id="f-obj-semana"></div></div><div class="field"><label>Objetivo</label><textarea class="input" id="f-obj-texto"></textarea></div>`; }
  else if(m.type==='pendiente-form'){ title='Nuevo contenido pendiente'; body = pendienteFormHtml(); }
  else if(m.type==='quick-week-form'){ title='Cargar semana'; body = quickWeekFormHtml(m.data); }
  else if(m.type==='documento-form'){ title='Subir documento'; body = documentoFormHtml(); }
  else if(m.type==='planilla-form'){ title='Nueva Planilla Digital FAT'; body = planillaFormHtml(); }

  return `

/* =========================================================================
   EVENTS
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  document.documentElement.setAttribute('data-theme', ui.theme);
  if(!session){ app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  if(session.role==='alumno'){ app.innerHTML = renderStudentPortalPage(); attachGlobalEvents(); return; }
  app.innerHTML = renderShell();
  attachGlobalEvents();
}

function attachLoginEvents(){
  const doLogin = async ()=>{
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    if(!u.trim() || !p){ document.getElementById('app').innerHTML = renderLogin('Completá usuario y contraseña.'); attachLoginEvents(); return; }
    const btn = document.getElementById('login-submit');
    if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Ingresando…'; }
    try{
      await tryLogin(u,p);
      if(session.role==='alumno') await loadStudentPortal();
      else await loadDB();
      render();
      if(session.role==='seccion' || session.role==='alumno'){ loadMyDocumentos().then(render).catch(()=>{}); }
    }catch(e){
      document.getElementById('app').innerHTML = renderLogin(e.message || 'Usuario o contraseña incorrectos.');
      attachLoginEvents();
    }
  };
  const btn = document.getElementById('login-submit');
  if(btn) btn.addEventListener('click', doLogin);
  ['login-user','login-pass'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } });
  });
  const first = document.getElementById('login-user');
  if(first) first.focus();
}

let globalEventsAttached = false;
function attachGlobalEvents(){
  const app = document.getElementById('app');

  const search = document.getElementById('global-search');
  if(search){
    search.addEventListener('input', e=>{ ui.search = e.target.value; ui.page.students=1; if(ui.view!=='students') ui.view='students'; render(); document.getElementById('global-search').focus(); document.getElementById('global-search').setSelectionRange(999,999); });
  }
  const docSearch = document.getElementById('doc-search');
  if(docSearch){
    docSearch.addEventListener('input', e=>{ ui.docSearch = e.target.value; ui.page.documentosAlumno=1; render(); document.getElementById('doc-search').focus(); document.getElementById('doc-search').setSelectionRange(999,999); });
  }

  if(globalEventsAttached) return; // el #app persiste entre renders (solo cambia su innerHTML);
  globalEventsAttached = true;      // sin este guard, cada render() apilaría un listener más.

  app.addEventListener('dragstart', (e)=>{
    const t = e.target.closest('[data-drag-rotation]');
    if(t) e.dataTransfer.setData('text/rotation-id', t.getAttribute('data-drag-rotation'));
  });
  app.addEventListener('dragover', (e)=>{
    const t = e.target.closest('[data-action="cron-drop-target"]');
    if(t){ e.preventDefault(); t.classList.add('cron-drag-over'); }
  });
  app.addEventListener('dragleave', (e)=>{
    const t = e.target.closest('[data-action="cron-drop-target"]');
    if(t) t.classList.remove('cron-drag-over');
  });
  app.addEventListener('drop', async (e)=>{

    }
    else if(action==='close-modal' || action==='close-modal-bg'){ if(action==='close-modal-bg' && e.target!==t){ /* clic dentro del modal, no cerrar */ } else { ui.modal=null; render(); } }
    else if(action==='add-informe-semanal'){ addInformeSemanal(id); }
    else if(action==='export-student-pdf'){ exportStudentPDF(id); }
    else if(action==='export-all-excel'){ exportAllExcel(); }
    else if(action==='export-grades-excel'){ exportGradesExcel(); }
    else if(action==='export-all-pdf'){ exportAllPDF(); }
    else if(action==='submit-modal'){
      const type = t.getAttribute('data-type');
      if(type==='documento-form') await uploadDocumento();
      else if(type==='comunicado-form') await uploadComunicado();
      else await submitModal(action, type, t.getAttribute('data-id'));
    }
    else if(action==='sort-th'){
      const table = t.getAttribute('data-table'); const key = t.getAttribute('data-key');
      const cur = ui.sort[table];
      if(cur && cur.key===key){ cur.dir = cur.dir==='asc'?'desc':'asc'; } else { ui.sort[table] = {key, dir:'asc'}; }
      ui.page[table] = 1; render();
    }
    else if(action==='page'){
      const table = t.getAttribute('data-table'); const dir = t.getAttribute('data-dir'); const pnum = t.getAttribute('data-page');
      let cur = ui.page[table]||1;
      if(pnum!=null){ cur = Number(pnum); }
      else if(dir==='prev'){ cur = Math.max(1,cur-1); }
      else if(dir==='next'){ cur = cur+1; }
      ui.page[table] = cur; render();
    }
    else if(t.hasAttribute('data-tab')){
      const tabpanels = app.querySelectorAll('[data-tabpanel]');
      const tabs = app.querySelectorAll('[data-tab]');
      tabs.forEach(tb=>tb.classList.remove('active'));
      t.classList.add('active');
      const target = t.getAttribute('data-tab');
      tabpanels.forEach(p=>{ p.style.display = p.getAttribute('data-tabpanel')===target ? '' : 'none'; });
    }
  });

  app.addEventListener('dblclick', (e)=>{
    const t = e.target.closest('[data-action="act-day-click"]');
    if(!t) return;
    if(!(session.role==='admin'||session.role==='coordinador')) return;
    clearTimeout(window.__actClickTimer);
    ui.modal = {type:'actividad-dia-editor', data:{fecha:t.getAttribute('data-fecha')}};
    render();
  });

  app.addEventListener('change', async (e)=>{
    const t = e.target;
    if(t.matches('[data-action="filter-curso"]')){ ui.filters.curso = t.value; ui.page.students=1; render(); }
    else if(t.matches('[data-action="filter-estado"]')){ ui.filters.estado = t.value; ui.page.students=1; render(); }
    else if(t.matches('[data-action="filter-seccion"]')){ ui.filters.seccion = t.value; ui.page.students=1; render(); }
    else if(t.matches('[data-action="filter-doc-curso"]')){ ui.docFilters.curso = t.value; ui.page.documentosAlumno=1; render(); }
    else if(t.matches('[data-action="filter-doc-grupo"]')){ ui.docFilters.grupo = t.value; ui.page.documentosAlumno=1; render(); }
    else if(t.matches('[data-action="filter-doc-seccion"]')){ ui.docFilters.seccion = t.value; ui.page.documentosAlumno=1; render(); }
    else if(t.matches('[data-action="filter-grupo"]')){ ui.filters.grupo = t.value; ui.page.students=1; render(); }
    else if(t.matches('[data-action="filter-rot-seccion"]')){ ui.filters.rotSeccion = t.value; ui.page.rotations=1; render(); }
    else if(t.matches('[data-action="filter-rot-estado"]')){ ui.filters.rotEstado = t.value; ui.page.rotations=1; render(); }
    else if(t.matches('[data-action="filter-pln-seccion"]')){ ui.plnFilters.sectionId = t.value; await loadPlanillas(); render(); }
    else if(t.matches('[data-action="filter-pln-alumno"]')){ ui.plnFilters.studentId = t.value; await loadPlanillas(); render(); }
    else if(t.matches('[data-action="filter-pln-profesor"]')){ ui.plnFilters.teacherId = t.value; await loadPlanillas(); render(); }
    else if(t.matches('[data-action="filter-pln-desde"]')){ ui.plnFilters.desde = t.value; await loadPlanillas(); render(); }
    else if(t.matches('[data-action="filter-pln-hasta"]')){ ui.plnFilters.hasta = t.value; await loadPlanillas(); render(); }
    else if(t.matches('[data-action="cron-filtro-grupo"]')){ ui.cronFiltroGrupo = t.value; render(); }
    else if(t.matches('[data-action="cron-filtro-seccion"]')){ ui.cronFiltroSeccion = t.value; render(); }
    else if(t.matches('[data-action="cron-filtro-curso"]')){ ui.cronFiltroCurso = t.value; render(); }
    else if(t.classList && t.classList.contains('pln-calificacion')){
      const p = getPlanilla(currentPlanillaId);
      p.calificacion = t.value || null;
      autosavePlanilla({ calificacion: p.calificacion });
    }
    else if(t.matches('[data-action="pendiente-estado"]')){
      const id = t.getAttribute('data-id'); const estado = t.value;
      apiFetch('PUT', '/api/pendientes/'+id, { estado }).then(async ()=>{ await loadDB(); render(); toast('Estado actualizado'); }).catch(e=> toast(e.message||'No se pudo actualizar', 'red'));
    }
    else if(t.id==='f-doc-file'){
      const f = t.files && t.files[0];
      const textEl = document.getElementById('f-doc-file-text');
      if(f && textEl) textEl.textContent = f.name;
    }
    else if(t.matches('[data-action="com-destino-tipo"]')){
      const wrap = document.getElementById('f-com-profesores-wrap');
      if(wrap) wrap.style.display = t.value==='elegir' ? 'block' : 'none';
    }
    else if(t.matches('[data-action="act-aplica-toggle"]')){
      const wrap = document.getElementById('f-act-alumno-wrap');
      if(wrap) wrap.style.display = t.value==='alumno' ? 'block' : 'none';
    }
    else if(t.id==='f-com-files'){
      const files = t.files;
      const textEl = document.getElementById('f-com-files-text');
      if(textEl) textEl.textContent = files.length? files.length+' archivo'+(files.length===1?'':'s')+' seleccionado'+(files.length===1?'':'s')+': '+Array.from(files).map(f=>f.name).join(', ') : 'Hacé clic para seleccionar uno o más archivos';
    }
    else if(t.id==='sp-doc-file'){
      const f = t.files && t.files[0];
      if(!f) return;
      const allowedExt = ['.pdf','.doc','.docx','.xls','.xlsx'];
      const ext = '.'+(f.name.split('.').pop()||'').toLowerCase();
      const textEl = document.getElementById('sp-doc-file-text');
      const statusEl = document.getElementById('sp-doc-status');
      const progressWrap = document.getElementById('sp-doc-progress-wrap');
      const progressBar = document.getElementById('sp-doc-progress-bar');
      if(!allowedExt.includes(ext)){
        toast('Formato no permitido. Solo PDF, Word o Excel', 'red');
        t.value = '';
        return;
      }
      if(textEl) textEl.textContent = f.name;
      if(statusEl) statusEl.innerHTML = '<span class="cell-muted">'+formatFileSize(f.size)+' · Subiendo…</span>';
      if(progressWrap) progressWrap.style.display = 'block';
      if(progressBar) progressBar.style.width = '0%';

      const fd = new FormData();
      fd.append('file', f);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API_BASE+'/api/documentos');
      xhr.setRequestHeader('Authorization', 'Bearer '+authToken);
      xhr.upload.onprogress = (ev)=>{
        if(ev.lengthComputable && progressBar) progressBar.style.width = Math.round((ev.loaded/ev.total)*100)+'%';
      };
      xhr.onload = ()=>{
        if(xhr.status>=200 && xhr.status<300){
          let data={}; try{ data = JSON.parse(xhr.responseText); }catch(err){}
          const idField = document.getElementById('sp-doc-id'); if(idField) idField.value = data.id||'';
          const nameField = document.getElementById('sp-doc-name'); if(nameField) nameField.value = data.nombre||f.name;
          if(statusEl) statusEl.innerHTML = '<span class="file-chip">'+icon('paperclip','icon-sm')+' '+esc(data.nombre||f.name)+' · '+formatFileSize(f.size)+'</span>';
          if(progressWrap) progressWrap.style.display = 'none';
          toast('Documento subido');
        } else {
          let msg = 'No se pudo subir el archivo';
          if(xhr.status===401){ msg = handleSessionExpired(); }
          else { try{ msg = JSON.parse(xhr.responseText).error||msg; }catch(err){} }
          if(statusEl) statusEl.innerHTML = '<span style="color:var(--red);">'+esc(msg)+'</span>';
          if(progressWrap) progressWrap.style.display = 'none';
          toast(msg, 'red');
        }
      };
      xhr.onerror = ()=>{
        if(statusEl) statusEl.innerHTML = '<span style="color:var(--red);">Error de conexión al subir el archivo</span>';
        if(progressWrap) progressWrap.style.display = 'none';
        toast('Error de conexión al subir el archivo', 'red');
      };
      xhr.send(fd);
    }
    else if(t.id==='f-r-file'){
      const f = t.files && t.files[0];
      if(!f) return;
      const holder = document.getElementById('f-r-file-chip');
      if(holder) holder.innerHTML = '<span class="cell-muted" style="font-size:12.5px;"><span class="spinner spinner-accent" style="width:12px;height:12px;"></span> Subiendo '+esc(f.name)+'…</span>';
      (async ()=>{
        try{
          const fd = new FormData();
          fd.append('file', f);
          const res = await fetch(API_BASE+'/api/upload', { method:'POST', headers:{ Authorization:'Bearer '+authToken }, body: fd });
          const data = await res.json();
          if(!res.ok) throw new Error(data.error || 'No se pudo subir el archivo');
          document.getElementById('f-r-file-name').value = data.name;
          document.getElementById('f-r-file-url').value = data.url;
          if(holder) holder.innerHTML = '<a class="file-chip" href="'+esc(data.url)+'" target="_blank" rel="noopener" style="text-decoration:none;">'+icon('paperclip','icon-sm')+' '+esc(data.name)+'</a>';
          toast('Archivo subido');
        }catch(err){
          if(holder) holder.innerHTML = '';
          toast(err.message || 'No se pudo subir el archivo', 'red');
        }
      })();
    }
  });
}

async function addInformeSemanal(rotId){
  const sem = Number(document.getElementById('f-r-sem-num').value);
  const fecha = document.getElementById('f-r-sem-fecha').value;
  const texto = document.getElementById('f-r-sem-texto').value.trim();
  const notaVal = document.getElementById('f-r-sem-nota').value;
  const ausente = document.getElementById('f-r-sem-ausente').checked;
  if(!texto && !notaVal && !ausente){ toast('Cargá al menos un texto, una nota o marcá ausencia','red'); return; }
  try{
    await apiFetch('POST', '/api/rotations/'+rotId+'/weekly-report', {
      semana:sem, texto, fecha, nota: notaVal===''? null : Number(notaVal), ausente,
      motivo: ausente? 'Ausente en la semana '+sem : undefined
    });
    await loadDB();
    ui.modal = {type:'rotation-form', data:DB.rotations.find(r=>r.id===rotId)};
    render();
    toast('Registro semanal agregado');
  }catch(e){ toast(e.message||'No se pudo agregar el registro', 'red'); }
}

async function uploadDocumento(){
  const fileInput = document.getElementById('f-doc-file');
  const file = fileInput.files && fileInput.files[0];
  if(!file){ toast('Elegí un archivo para subir','red'); return; }
  const allowedExt = ['.pdf','.doc','.docx','.xls','.xlsx'];
  const ext = '.'+(file.name.split('.').pop()||'').toLowerCase();
  if(!allowedExt.includes(ext)){ toast('Formato no permitido. Solo .pdf, .doc, .docx, .xls o .xlsx','red'); return; }

  const fd = new FormData();
  fd.append('file', file);
  const tipoEl = document.getElementById('f-doc-tipo');
  if(tipoEl) fd.append('tipo', tipoEl.value);
  const alumnoEl = document.getElementById('f-doc-alumno');
  if(alumnoEl && alumnoEl.value) fd.append('studentId', alumnoEl.value);
  fd.append('observaciones', document.getElementById('f-doc-observaciones')? document.getElementById('f-doc-observaciones').value : '');

  const progressWrap = document.getElementById('f-doc-progress-wrap');
  const progressBar = document.getElementById('f-doc-progress-bar');
  if(progressWrap) progressWrap.style.display='block';
  const saveBtn = document.querySelector('[data-action="submit-modal"]');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Subiendo…'; }

  try{
    await new Promise((resolve, reject)=>{
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API_BASE+'/api/documentos');
      xhr.setRequestHeader('Authorization', 'Bearer '+authToken);
      xhr.upload.onprogress = (e)=>{
        if(e.lengthComputable && progressBar){ progressBar.style.width = Math.round((e.loaded/e.total)*100)+'%'; }
      };
      xhr.onload = ()=>{
        if(xhr.status>=200 && xhr.status<300) resolve();
        else if(xhr.status===401) reject(new Error(handleSessionExpired()));
        else{ let msg='No se pudo subir el archivo'; try{ msg = JSON.parse(xhr.responseText).error||msg; }catch(e){} reject(new Error(msg)); }
      };
      xhr.onerror = ()=> reject(new Error('Error de conexión al subir el archivo'));
      xhr.send(fd);
    });
    ui.modal = null;
    if(session.role==='admin'){ await loadDocumentos(); }
    else { await loadMyDocumentos(); }
    render();
    toast('Documento subido correctamente');
  }catch(e){
    toast(e.message||'No se pudo subir el archivo', 'red');
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Guardar'; }
    if(progressWrap) progressWrap.style.display='none';
  }
}

async function uploadComunicado(){
  const titulo = document.getElementById('f-com-titulo').value.trim();
  if(!titulo){ toast('Ponele un título al lineamiento','red'); return; }
  const descripcion = document.getElementById('f-com-descripcion').value.trim();
  const prioridad = document.getElementById('f-com-prioridad').value;
  const vencimiento = document.getElementById('f-com-vencimiento').value || '';
  const destinoTipo = document.getElementById('f-com-destino').value;
  const checked = Array.from(document.querySelectorAll('.f-com-profesor-check:checked')).map(c=>c.value);
  if(destinoTipo==='elegir' && !checked.length){ toast('Elegí al menos un profesor destinatario','red'); return; }
  const destinatarioTipo = destinoTipo==='todos' ? 'todos' : (checked.length===1? 'especifico' : 'varios');

  const fd = new FormData();
  fd.append('titulo', titulo);
  fd.append('descripcion', descripcion);
  fd.append('prioridad', prioridad);
  fd.append('destinatarioTipo', destinatarioTipo);
  fd.append('destinatarios', JSON.stringify(destinoTipo==='todos'? [] : checked));
  if(vencimiento) fd.append('vencimiento', vencimiento);
  const files = document.getElementById('f-com-files').files;
  Array.from(files).forEach(f=> fd.append('adjuntos', f));

  const progressWrap = document.getElementById('f-com-progress-wrap');
  const progressBar = document.getElementById('f-com-progress-bar');
  if(progressWrap) progressWrap.style.display='block';
  const saveBtn = document.querySelector('[data-action="submit-modal"]');
  if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Enviando…'; }

  try{
    await new Promise((resolve, reject)=>{
      const xhr = new XMLHttpRequest();
      xhr.open('POST', API_BASE+'/api/comunicados');
      xhr.setRequestHeader('Authorization', 'Bearer '+authToken);
      xhr.upload.onprogress = (e)=>{
        if(e.lengthComputable && progressBar){ progressBar.style.width = Math.round((e.loaded/e.total)*100)+'%'; }
      };
      xhr.onload = ()=>{
        if(xhr.status>=200 && xhr.status<300) resolve();
        else if(xhr.status===401) reject(new Error(handleSessionExpired()));
        else{ let msg='No se pudo enviar el lineamiento'; try{ msg = JSON.parse(xhr.responseText).error||msg; }catch(e){} reject(new Error(msg)); }
      };
      xhr.onerror = ()=> reject(new Error('Error de conexión al enviar el lineamiento'));
      xhr.send(fd);
    });
    ui.modal = null;
    await loadDB();
    render();
    toast('Lineamiento enviado correctamente');
  }catch(e){
    toast(e.message||'No se pudo enviar el lineamiento', 'red');
    if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Guardar'; }
    if(progressWrap) progressWrap.style.display='none';
  }
}

      };

      if(id){
        await apiFetch('PUT', '/api/students/'+id, data);

      const empresa = val('f-cronadd-empresa'); const observaciones = val('f-cronadd-observaciones');
      if(startDate>endDate){ toast('La fecha de inicio no puede ser posterior a la de fin','red'); return; }
      await apiFetch('POST', '/api/rotations', { studentId:data.studentId, sectionId, teacherId, startDate, endDate, empresa, observaciones });
      await loadDB(); ui.modal=null; render(); toast('Rotación creada');
    }
    else if(type==='usuario-form'){
      const nombre = val('f-usu-nombre'); const username = val('f-usu-username'); const password = val('f-usu-password');
      if(!nombre || !username){ toast('Completá nombre y usuario','red'); return; }
      if(id){
        const payload = { nombre, username };
        if(password) payload.password = password;
        await apiFetch('PUT', '/api/usuarios/'+id, payload);
      } else {
        if(!password){ toast('La contraseña es obligatoria para un usuario nuevo','red'); return; }
        await apiFetch('POST', '/api/usuarios', { nombre, username, password });
      }
      await loadUsuarios(); ui.modal=null; render(); toast(id? 'Usuario actualizado':'Usuario VIEW ADMIN creado');
    }
    else if(type==='quick-week-form'){
      const r = DB.rotations.find(x=>x.id===id);
      const st = DB.students.find(s=>s.id===r.studentId);
      const wk = st? currentWeekOf(st) : r.orden;
      const notaVal = val('f-qw-nota');
      const ausente = document.getElementById('f-qw-ausente').checked;
      const texto = val('f-qw-texto');
      if(!texto && !notaVal && !ausente){ toast('Cargá al menos un texto, una nota o marcá ausencia','red'); return; }
      await apiFetch('POST', '/api/rotations/'+id+'/weekly-report', {
        semana: wk, texto, fecha: todayISO(), nota: notaVal===''?null:Number(notaVal), ausente,
        motivo: ausente? 'Ausente en la semana '+wk : undefined
      });
      await loadDB(); ui.modal=null; render(); toast('Semana cargada');
    }
  }catch(e){
    toast(e.message || 'No se pudo guardar', 'red');
  }
}
function val(id){ const e=document.getElementById(id); return e? e.value.trim() : ''; }

/* =========================================================================
   EXPORTS
   ========================================================================= */
function exportStudentPDF(studentId){
  const s = DB.students.find(x=>x.id===studentId);
  if(!s || !window.jspdf){ toast('No se pudo generar el PDF','red'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 18;
  doc.setFontSize(16); doc.text('Informe FAT — '+s.nombre+' '+s.apellido, 14, y); y+=8;
  doc.setFontSize(10); doc.text('Legajo: '+s.legajo+'   DNI: '+s.dni+'   Curso: '+s.curso+' "'+s.division+'"', 14, y); y+=10;
  rotationsOf(s.id).forEach((r,idx)=>{
    if(y>260){ doc.addPage(); y=18; }
    doc.setFontSize(12); doc.text((idx+1)+'. '+sectionName(r.sectionId)+' ('+fmtDate(r.startDate)+' - '+fmtDate(r.endDate)+')', 14, y); y+=6;
    doc.setFontSize(9);
    const lines = [
      'Profesor: '+teacherName(r.teacherId)+'   Estado: '+r.status+'   Promedio: '+(rotationAvg(r)==null?'-':rotationAvg(r).toFixed(1)),
      r.plan? 'Plan: '+r.plan : '',
      r.actividades? 'Actividades: '+r.actividades : '',
      r.observaciones? 'Observaciones: '+r.observaciones : '',
      r.informeFinal? 'Informe final: '+r.informeFinal : '',
    ].filter(Boolean);
    lines.forEach(line=>{
      const wrapped = doc.splitTextToSize(line, 180);
      wrapped.forEach(w=>{ if(y>270){ doc.addPage(); y=18; } doc.text(w,14,y); y+=5; });
    });
    y+=4;
  });
  doc.save('FAT_'+s.apellido+'_'+s.nombre+'.pdf');
}

function exportAllPDF(){
  if(!window.jspdf){ toast('No se pudo generar el PDF','red'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(16); doc.text('Informe general FAT', 14, 18);
  doc.setFontSize(9); doc.text('Generado el '+fmtDate(todayISO()), 14, 25);
  let y=35;
  doc.setFontSize(11);
  DB.students.forEach(s=>{
    if(y>270){ doc.addPage(); y=18; }
    doc.text(s.nombre+' '+s.apellido+' — Legajo '+s.legajo+' — Promedio: '+(studentAvg(s.id)||'-')+' — Estado: '+s.estado, 14, y);
    y+=7;
  });
  doc.save('FAT_informe_general.pdf');
}

function exportAllExcel(){
  if(!window.XLSX){ toast('No se pudo generar el Excel','red'); return; }
  const rows = DB.students.map(s=>({
    Nombre:s.nombre, Apellido:s.apellido, DNI:s.dni, Legajo:s.legajo, Curso:s.curso, División:s.division,
    'Fecha de inicio':s.fechaInicio, Estado:s.estado, 'Semana actual': s.estado==='activo'?currentWeekOf(s):'-',
    'Sección actual': currentRotationOf(s.id)? sectionName(currentRotationOf(s.id).sectionId):'-',
    Promedio: studentAvg(s.id)||'-'
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Alumnos');
  XLSX.writeFile(wb, 'FAT_alumnos.xlsx');
}

function exportGradesExcel(){
  if(!window.XLSX){ toast('No se pudo generar el Excel','red'); return; }
  const rows = DB.rotations.map(r=>({
    Alumno: studentName(r.studentId), Sección: sectionName(r.sectionId), Profesor: teacherName(r.teacherId),
    Estado: r.status, Promedio: rotationAvg(r)==null?'':rotationAvg(r).toFixed(1),
    Inicio:r.startDate, Fin:r.endDate
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Calificaciones');
  XLSX.writeFile(wb, 'FAT_calificaciones.xlsx');
}

/* =========================================================================
   INIT
   ========================================================================= */
async function init(){
  loadSession();
  if(session && authToken){
    try{
      if(session.role==='alumno'){ await loadStudentPortal(); }
      else{
        await loadDB();
        ui.view = session.role==='seccion' ? 'teacherHome' : 'dashboard';
        const vistasRestaurables = ['dashboard','teacherHome','students','sections','rotations','grades','guidelines','reports','pendientes','cronograma','planillas','documentos','usuarios','config'];
        try{
          const ultimaVista = localStorage.getItem('fat_last_view');
          if(ultimaVista && vistasRestaurables.includes(ultimaVista)) ui.view = ultimaVista;
        }catch(e){}
        if(ui.view==='documentos') loadDocumentos().catch(()=>{}).then(render);
        if(ui.view==='planillas') Promise.all([loadPlanillas(), loadCriterios()]).catch(()=>{}).then(render);
        if(ui.view==='cronograma'){ ui.plnFilters={}; loadPlanillas().catch(()=>{}).then(render); }
        if(ui.view==='config' && session.role==='admin') loadCriterios().catch(()=>{}).then(render);
        if(ui.view==='usuarios') loadUsuarios().catch(()=>{}).then(render);
      }
      if(session.role==='seccion' || session.role==='alumno'){ loadMyDocumentos().then(render).catch(()=>{}); }
    }catch(e){
      console.error('No se pudo restaurar la sesión', e);
      authToken=null; session=null;
      localStorage.removeItem('fat_token'); localStorage.removeItem('fat_session');
    }
  }
  render();
}
init().catch(e=>{
  console.error('init failed', e);
  document.getElementById('app').innerHTML = `
  <div class="login-wrap">
    <div class="login-card" style="max-width:420px; text-align:center;">
      <div class="login-mark" style="margin:0 auto 12px;">FAT</div>
      <h2 style="font-size:16px;">No se pudo conectar con el servidor</h2>
      <p class="help-text">Verificá que el backend (Express + SQLite) esté corriendo y volvé a cargar la página.</p>
    </div>
  </div>`;
});
</script>
